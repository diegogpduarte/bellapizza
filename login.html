<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e cadastro - Bella Piazza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cabecalho"></div>
    <main>
        <div class="duas-colunas">
            <form id="login" onsubmit="fazerLogin(); return false;">
                <h2>Entrar</h2>
                <label>E-mail</label>
                <input type="email" id="loginEmail" maxlength="80">
                <label>Senha</label>
                <input type="password" id="loginSenha" maxlength="20">
                <p class="erro" id="erroLogin"></p>
                <button type="submit">Entrar</button>
            </form>

            <form id="cadastro" onsubmit="cadastrar(); return false;">
                <h2>Criar conta</h2>
                <label>Nome completo</label>
                <input type="text" id="cadNome" maxlength="60" oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ ]/g, '')">
                <label>E-mail</label>
                <input type="email" id="cadEmail" maxlength="80">
                <label>CPF</label>
                <input type="text" id="cadCpf" maxlength="14" placeholder="000.000.000-00" oninput="this.value = mascaraCPF(this.value)">
                <label>Telefone</label>
                <input type="text" id="cadTelefone" maxlength="15" placeholder="(00) 00000-0000" oninput="this.value = mascaraTelefone(this.value)">
                <label>Data de nascimento</label>
                <input type="text" id="cadNascimento" maxlength="10" placeholder="dd/mm/aaaa" oninput="this.value = mascaraData(this.value)">
                <label>CEP</label>
                <input type="text" id="cadCep" maxlength="9" placeholder="00000-000" oninput="this.value = mascaraCEP(this.value)">
                <label>Endereço</label>
                <input type="text" id="cadEndereco" maxlength="80">
                <label>Número</label>
                <input type="text" id="cadNumero" maxlength="6" oninput="this.value = this.value.replace(/\D/g, '')">
                <label>Senha (6 a 20 caracteres)</label>
                <input type="password" id="cadSenha" maxlength="20">
                <p class="erro" id="erroCadastro"></p>
                <button type="submit">Criar conta</button>
            </form>
        </div>
    </main>
    <div id="rodape"></div>
    <script src="script.js"></script>
</body>
</html>
